services:
  - type: web
    name: edupath-ai-mochikawaiii
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_MS
        value: "28800000"
      # Supply the existing Render PostgreSQL connection; never commit credentials.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_AUTO_MIGRATE
        value: "true"
      # Optional: match services/ocr/.env to enable the pull-based demo worker.
      - key: OCR_WORKER_KEY
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_AUTHORITY
        value: https://login.microsoftonline.com/organizations
      - key: ENTRA_ALLOW_ANY_TENANT
        value: "true"
      # Use the original multitenant Entra app; no school-specific allowlist.
      - key: ENTRA_ALLOWED_TENANT_IDS
        value: ""
      - key: AUTH_DEFAULT_ROLE
        value: student
